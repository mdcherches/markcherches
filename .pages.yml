media:
  - name: images
    label: Images
    input: assets/images
    output: /assets/images
    extensions: [jpg, jpeg, png, webp]
    categories: [image]
    rename: safe

content:
  - name: portfolio
    label: Portfolio content
    type: file
    path: content/site.json
    format: json
    fields:
      - name: meta
        label: Site settings
        type: object
        fields:
          - name: siteTitle
            label: Browser title
            type: string
            required: true
          - name: description
            label: Search description
            type: text
            required: true
          - name: initials
            label: Header initials
            type: string
            required: true
          - name: ownerName
            label: Footer name
            type: string
            required: true
          - name: year
            label: Footer year
            type: string
            required: true

      - name: home
        label: Introduction & portrait
        type: object
        fields:
          - name: firstName
            label: First name
            type: string
            required: true
          - name: lastName
            label: Last name
            type: string
            required: true
          - name: eyebrow
            label: Short headline
            type: string
            required: true
          - name: summary
            label: Introduction
            type: text
            required: true
          - name: current
            label: Current work paragraph
            type: text
          - name: image
            label: Portrait
            type: image
            description: Upload a JPG, JPEG, PNG, or WebP image.
            options:
              media: images
              extensions: [jpg, jpeg, png, webp]
          - name: imageAlt
            label: Portrait description
            type: string

      - name: work
        label: Optional selected work
        type: object
        fields:
          - name: visible
            label: Show this section on the website
            type: boolean
            default: false
          - name: heading
            label: Heading
            type: string
            required: true
          - name: intro
            label: Introduction (optional)
            type: text
          - name: items
            label: Work items
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Title
                type: string
                required: true
              - name: context
                label: Organization or context
                type: string
              - name: description
                label: Description
                type: text
                required: true
              - name: url
                label: Link (optional)
                type: string
                description: Leave blank when there is no public link.

      - name: about
        label: About section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: paragraphs
            label: Paragraphs
            type: text
            list: true
            required: true

      - name: projects
        label: Optional projects
        type: object
        fields:
          - name: visible
            label: Show this section on the website
            type: boolean
            default: false
          - name: heading
            label: Heading
            type: string
            required: true
          - name: intro
            label: Introduction
            type: string
          - name: items
            label: Projects
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Project name
                type: string
                required: true
              - name: description
                label: Description
                type: text
                required: true
              - name: url
                label: Project link
                type: string
              - name: demo
                label: Interactive demo
                type: string
                description: Use snapchat-lenses to show the live lens player.

      - name: experience
        label: Experience
        type: object
        fields:
          - name: visible
            label: Show this section on the website
            type: boolean
            default: false
          - name: heading
            label: Heading
            type: string
            required: true
          - name: intro
            label: Introduction
            type: string
          - name: items
            label: Roles
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{role} — {organization}"
            fields:
              - name: period
                label: Dates
                type: string
                required: true
              - name: role
                label: Role
                type: string
                required: true
              - name: organization
                label: Organization
                type: string
                required: true
              - name: detail
                label: Team or focus
                type: string
              - name: details
                label: Expanded role details
                description: The entire role, including these bullets, appears together as visitors scroll.
                type: text
                list: true

      - name: research
        label: Optional research section
        type: object
        fields:
          - name: visible
            label: Show this section on the website
            type: boolean
            default: false
          - name: heading
            label: Heading
            type: string
            required: true
          - name: intro
            label: Introduction
            type: string
          - name: items
            label: Research items
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title} ({year})"
            fields:
              - name: year
                label: Year
                type: string
              - name: title
                label: Title
                type: string
                required: true
              - name: topic
                label: Topic tags
                type: string
              - name: description
                label: Description
                type: text
              - name: url
                label: Link
                type: string

      - name: contact
        label: Contact footer
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: intro
            label: Introduction
            type: string
          - name: items
            label: Contact links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: icon
                label: Icon
                type: select
                options:
                  values: [email, linkedin, github, link]
              - name: label
                label: Display text
                type: string
                required: true
              - name: url
                label: Link
                type: string
                required: true

      - name: socials
        label: Introduction social links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: icon
            label: Icon
            type: select
            options:
              values: [email, linkedin, github, link]
          - name: label
            label: Link label
            type: string
            required: true
          - name: url
            label: Link
            type: string
            required: true

settings:
  content:
    merge: true
  commit:
    templates:
      create: "content: create {name}"
      update: "content: update portfolio"
      delete: "content: remove {name}"
